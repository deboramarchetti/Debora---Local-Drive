<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This page has been migrated!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }
        .warning {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .new-link {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b35, #f7c948);
            color: #0a0a0a;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            border-radius: 8px;
            margin: 20px 0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .new-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
        }
        .countdown {
            font-size: 5em;
            font-weight: bold;
            margin: 30px 0;
            color: #ff3333;
            text-shadow: 0 0 30px rgba(255, 51, 51, 0.8);
            transition: all 0.3s;
        }
        .countdown.shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            75% { transform: translateX(10px) rotate(2deg); }
        }
        .gif-container {
            margin: 20px 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .gif-container.visible {
            opacity: 1;
        }
        .gif-container img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(255, 107, 53, 0.4);
        }
        .status {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
        }
        .blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .boom {
            font-size: 8em;
            display: none;
            animation: boom 0.5s ease-out;
        }
        @keyframes boom {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: fly 2s ease-out forwards;
        }
        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <h1>This page has been migrated!</h1>
        <p class="warning">
            All data, dashboards, and webhooks have been safely relocated.<br>
            This deployment will self-destruct in...
        </p>

        <div class="countdown" id="countdown">5</div>

        <div class="gif-container" id="gif">
            <img src="https://media1.giphy.com/media/xih6nCPZh8MkrAvpN7/giphy.gif" alt="Explosion!">
        </div>

        <div class="boom" id="boom">BOOM!</div>

        <a href="https://darwin-nuvemshop.vercel.app" class="new-link" id="link">
            Go to the new dashboard
        </a>

        <p class="status" id="status">
            <span class="blink">_</span> Initiating self-destruct sequence...
        </p>
    </div>

    <script>
        let count = 5;
        const countdownEl = document.getElementById('countdown');
        const gifEl = document.getElementById('gif');
        const boomEl = document.getElementById('boom');
        const statusEl = document.getElementById('status');
        const linkEl = document.getElementById('link');
        const particlesEl = document.getElementById('particles');

        function createParticles() {
            const colors = ['#ff6b35', '#f7c948', '#ff3333', '#ff9500', '#ffcc00'];
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 12 + 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = '50%';
                p.style.top = '50%';
                p.style.setProperty('--tx', (Math.random() - 0.5) * window.innerWidth + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * window.innerHeight + 'px');
                p.style.animationDelay = Math.random() * 0.3 + 's';
                particlesEl.appendChild(p);
            }
        }

        const interval = setInterval(() => {
            count--;
            if (count > 0) {
                countdownEl.textContent = count;
                countdownEl.classList.remove('shake');
                void countdownEl.offsetWidth;
                countdownEl.classList.add('shake');
                statusEl.innerHTML = '<span class="blink">_</span> T-minus ' + count + '...';
            } else if (count === 0) {
                countdownEl.textContent = '0';
                countdownEl.style.color = '#ff0000';
                statusEl.innerHTML = '<span class="blink">_</span> DETONATION IMMINENT';
            } else {
                clearInterval(interval);
                countdownEl.style.display = 'none';
                gifEl.classList.add('visible');
                boomEl.style.display = 'block';
                createParticles();
                statusEl.innerHTML = 'Goodbye, old friend. You served us well.';
                linkEl.style.animation = 'blink 0.5s 3';
                document.body.style.background = '#1a0500';
                setTimeout(() => {
                    document.body.style.background = '#0a0a0a';
                }, 200);
            }
        }, 1000);
    </script>
</body>
</html>
